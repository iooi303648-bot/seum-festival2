<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>세움학교 축제 - 디지털 갤러리</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;overflow:hidden;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center}
#loading{position:fixed;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;z-index:999}
#loading.done{display:none}
#load-text{color:#fff;font-size:18px;font-weight:700}
#load-sub{color:rgba(255,255,255,.4);font-size:12px}
#bar-wrap{width:260px;height:5px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden}
#bar{height:100%;background:#3b82f6;border-radius:3px;width:0;transition:width .3s}
#canvas{position:relative;width:96vw;max-width:1800px;aspect-ratio:16/9;max-height:92vh;border-radius:40px;box-shadow:0 60px 120px -20px rgba(0,0,0,.9);overflow:hidden}
.slide{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .5s;z-index:1}
.slide.active{opacity:1;pointer-events:auto;z-index:2}
.s-hdr{position:absolute;top:24px;left:36px;right:36px;display:flex;align-items:center;justify-content:space-between;z-index:10;pointer-events:none}
.s-brand{display:flex;align-items:center;gap:12px;padding:7px 18px 7px 7px;border-radius:999px;backdrop-filter:blur(12px)}
.s-brand.lt{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2)}
.s-brand.dk{background:rgba(0,0,0,.05);border:1px solid rgba(0,0,0,.08)}
.s-eyo{width:34px;height:34px;border-radius:50%;object-fit:contain;background:#fff}
.s-nm{font-size:14px;font-weight:900;letter-spacing:-.02em}
.s-nm.lt{color:#fff} .s-nm.dk{color:#111}
.s-sb{font-size:9px;font-weight:700;letter-spacing:.2em;text-transform:uppercase}
.s-sb.lt{color:rgba(255,255,255,.45)} .s-sb.dk{color:rgba(0,0,0,.35)}
.s-cnt{font-family:monospace;font-size:12px;font-weight:900;padding:5px 14px;border-radius:10px}
.s-cnt.lt{color:rgba(255,255,255,.35);border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05)}
.s-cnt.dk{color:rgba(0,0,0,.3);border:1px solid rgba(0,0,0,.08);background:rgba(0,0,0,.03)}
.g-wrap{display:flex;flex-direction:column;height:100%;background:#fff}
.g-top{padding:16px 32px 10px;border-bottom:1px solid #f0f0f0;display:flex;flex-direction:column;align-items:center;gap:3px;flex-shrink:0}
.g-title{display:flex;align-items:center;gap:10px;font-size:clamp(16px,2.4vw,30px);font-weight:900;letter-spacing:-.03em;color:#1a1a1a}
.g-slogo{height:2.4rem;width:auto;object-fit:contain}
.g-sub{font-size:clamp(9px,1vw,12px);font-weight:700;color:#bbb;font-style:italic}
.g-grid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:14px;padding:14px 22px 18px;flex:1;min-height:0}
.g-cell{border-radius:18px;overflow:hidden;background:#f8f8f8;border:1px solid #eee;display:flex;align-items:center;justify-content:center}
.g-cell img{width:100%;height:100%;object-fit:contain}
.dk-slide{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:72px 48px}
#ctrl{position:fixed;bottom:18px;display:flex;align-items:center;gap:18px;background:rgba(255,255,255,.95);backdrop-filter:blur(20px);padding:9px 26px;border-radius:999px;border:1px solid rgba(255,255,255,.5);box-shadow:0 16px 40px rgba(0,0,0,.25);z-index:200}
#ctrl.hidden{display:none}
.c-btn{width:34px;height:34px;border-radius:50%;background:transparent;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#555}
.c-btn:hover{background:rgba(0,0,0,.06)}
#pbtn{width:38px;height:38px;border-radius:50%;background:#111;color:#fff;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.2)}
#pbtn.on{background:#3b82f6}
.c-div{width:1px;height:18px;background:rgba(0,0,0,.1)}
#rbtn{background:#111;color:#fff;border:none;cursor:pointer;padding:7px 16px;border-radius:999px;font-size:10px;font-weight:700;letter-spacing:.1em;display:flex;align-items:center;gap:5px;font-family:inherit}
#esc{position:fixed;bottom:22px;color:rgba(255,255,255,.2);font-size:10px;font-weight:700;letter-spacing:.35em;text-transform:uppercase;display:none}
</style>
</head>
<body>
<div id="loading">
  <div id="load-text">이미지 불러오는 중...</div>
  <div id="bar-wrap"><div id="bar"></div></div>
  <div id="load-sub">0 / 0</div>
  <div style="color:rgba(255,255,255,.15);font-size:10px;font-weight:700;letter-spacing:.3em;text-transform:uppercase;margin-top:4px">Seum School Festival</div>
</div>
<div id="canvas"></div>
<div id="ctrl">
  <button class="c-btn" onclick="go(cur-1)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>
  <button id="pbtn" onclick="togglePlay()">
    <svg id="iplay" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
    <svg id="ipause" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="display:none"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
  </button>
  <button class="c-btn" onclick="go(cur+1)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></button>
  <div class="c-div"></div>
  <button id="rbtn" onclick="recMode()"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg> RECORDING MODE</button>
</div>
<div id="esc">PRESS ESC TO RESTORE MENU</div>

<script>
const RAW='https://raw.githubusercontent.com/iooi303648-bot/seum-festival2/main/';
function enc(f){return f.split('').map(c=>c===' '?'%20':c==='('?'%28':c===')'?'%29':c).join('');}
const photos=Array.from({length:106},(_,i)=>{const n=i+1,ext=(n>=46&&n<=54)?'.JPG':'.jpg';return RAW+enc('\uc0ac\uc9c4 ('+n+')'+ext);});
const titleImg=RAW+'KakaoTalk_20260504_111859834.png';
const TOTAL=Math.ceil(photos.length/4)+2;
let cur=0,playing=false,timer=null,actx=null,ipm=false,mt=null;
const canvas=document.getElementById('canvas');

function hdr(light,idx){
  const d=document.createElement('div');d.className='s-hdr';
  const t=light?'lt':'dk';
  const brand=document.createElement('div');brand.className='s-brand '+t;
  const ey=document.createElement('img');ey.src=SLOGO;ey.className='s-eyo';
  const tx=document.createElement('div');
  const nm=document.createElement('div');nm.className='s-nm '+t;nm.textContent='\ub3d9\uc77c\uc911\uc559\ucd08\ub4f1\ud559\uad50';
  const sb=document.createElement('div');sb.className='s-sb '+t;sb.textContent='Seum School Festival';
  tx.appendChild(nm);tx.appendChild(sb);
  brand.appendChild(ey);brand.appendChild(tx);
  const cnt=document.createElement('div');cnt.className='s-cnt '+t;
  cnt.textContent=String(idx+1).padStart(2,'0')+' / '+String(TOTAL).padStart(2,'0');
  d.appendChild(brand);d.appendChild(cnt);
  return d;
}

// 인트로
(()=>{
  const d=document.createElement('div');
  d.className='slide active dk-slide';d.style.background='#0d0d1f';
  const img=document.createElement('img');
  img.src=titleImg;img.style.cssText='max-height:58%;width:auto;max-width:80%;object-fit:contain;border-radius:20px';
  img.alt='\uc778\ud2b8\ub85c';
  const p=document.createElement('p');
  p.style.cssText='margin-top:24px;font-size:clamp(14px,2vw,26px);font-weight:300;color:rgba(255,255,255,.9);text-align:center;line-height:1.7';
  p.textContent='\uc6b0\ub9ac\uac00 \uc9c1\uc811 \ub9cc\ub4e4\uace0 \ubc30\uc6b0\ub294\n\ubc18\uc9dd\ubc18\uc9dd \uc990\uac70\uc6b4 \ucd95\uc81c \uc774\uc57c\uae30 \u2728';
  d.appendChild(img);d.appendChild(p);d.appendChild(hdr(true,0));canvas.appendChild(d);
})();

// 갤러리
for(let i=0;i<photos.length;i+=4){
  const idx=Math.floor(i/4)+1;
  const d=document.createElement('div');d.className='slide';
  const w=document.createElement('div');w.className='g-wrap';
  const top=document.createElement('div');top.className='g-top';
  const title=document.createElement('div');title.className='g-title';
  const bell=document.createElement('span');bell.textContent='🔔';
  const rlogo=document.createElement('img');rlogo.src=RLOGO;rlogo.className='g-slogo';rlogo.alt='\uc138\uc6c0\ub85c\uace0';
  const act=document.createElement('span');act.textContent='\uad50\uc721\ud65c\ub3d9';
  title.appendChild(bell);title.appendChild(rlogo);title.appendChild(act);
  const sub=document.createElement('div');sub.className='g-sub';
  sub.textContent='\uce5c\uad6c\ub4e4\uacfc \ud568\uaed8\ud55c \uc990\uac70\uc6b4 \uc21c\uac04\ub4e4 \u2728';
  top.appendChild(title);top.appendChild(sub);
  const grid=document.createElement('div');grid.className='g-grid';
  photos.slice(i,i+4).forEach((url,j)=>{
    const cell=document.createElement('div');cell.className='g-cell';
    const img=document.createElement('img');img.src=url;
    img.alt='\uc138\uc6c0\ud559\uad50 \ud65c\ub3d9 '+(i+j+1);
    img.onerror=()=>{cell.style.background='#f0f0f0';};
    cell.appendChild(img);grid.appendChild(cell);
  });
  w.appendChild(top);w.appendChild(grid);
  d.appendChild(w);d.appendChild(hdr(false,idx));canvas.appendChild(d);
}

// 아웃트로
(()=>{
  const idx=TOTAL-1;
  const d=document.createElement('div');d.className='slide dk-slide';d.style.background='#000';
  const logoWrap=document.createElement('div');
  logoWrap.style.cssText='width:72px;height:72px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 24px;overflow:hidden;box-shadow:0 8px 32px rgba(255,255,255,.15)';
  const elo=document.createElement('img');elo.src=SLOGO;elo.style.cssText='width:80%;height:80%;object-fit:contain';
  logoWrap.appendChild(elo);
  const h1=document.createElement('div');
  h1.style.cssText='font-size:clamp(36px,6vw,80px);font-weight:900;letter-spacing:-.05em;color:#fff;text-align:center;line-height:1.05;white-space:pre-line';
  h1.textContent='\ub354 \ub113\uc740 \uc138\uc0c1\uc73c\ub85c\n\ud568\uaed8 \ub098\uc544\uac00\uc694!';
  const h2=document.createElement('div');
  h2.style.cssText='margin-top:20px;font-size:clamp(13px,1.6vw,22px);font-weight:300;color:rgba(255,255,255,.8);text-align:center;line-height:1.7;white-space:pre-line';
  h2.textContent='\uc5b8\uc81c\ub098 \uc2a4\uc2a4\ub85c \uc0dd\uac01\ud558\uace0 \uc2e4\uccœ\ud558\ub294\n\uba4b\uc9c4 \uc138\uc6c0\ud559\uad50 \uc5b4\ub9b0\uc774\uac00 \ub420\uac8c\uc694! \u2728';
  d.appendChild(logoWrap);d.appendChild(h1);d.appendChild(h2);d.appendChild(hdr(true,idx));canvas.appendChild(d);
})();

const sls=canvas.querySelectorAll('.slide');
function go(n){if(n<0||n>=TOTAL)return;sls[cur].classList.remove('active');cur=n;sls[cur].classList.add('active');}
function togglePlay(){
  playing=!playing;
  document.getElementById('iplay').style.display=playing?'none':'block';
  document.getElementById('ipause').style.display=playing?'block':'none';
  document.getElementById('pbtn').classList.toggle('on',playing);
  if(playing){playMusic();timer=setInterval(()=>go((cur+1)%TOTAL),3500);}
  else{stopMusic();clearInterval(timer);}
}
function recMode(){if(!playing)togglePlay();document.getElementById('ctrl').classList.add('hidden');document.getElementById('esc').style.display='block';}
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight')go(cur+1);
  if(e.key==='ArrowLeft')go(cur-1);
  if(e.key===' '&&document.activeElement.tagName!=='BUTTON'){e.preventDefault();togglePlay();}
  if(e.key==='Escape'){document.getElementById('ctrl').classList.remove('hidden');document.getElementById('esc').style.display='none';}
});
function playMusic(){
  if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();
  if(actx.state==='suspended')actx.resume();
  ipm=true;
  const nf={C4:261.63,D4:293.66,E4:329.63,F4:349.23,G4:392,A4:440,B4:493.88,C5:523.25};
  const mel=[['E4',.4],['G4',.4],['A4',.4],['G4',.4],['E4',.4],['C4',.4],['D4',.4],['E4',.8],['E4',.4],['G4',.4],['A4',.4],['G4',.4],['E4',.4],['C4',.4],['D4',.4],['C4',.8],['G4',.4],['A4',.4],['C5',.4],['A4',.4],['G4',.4],['E4',.4],['F4',.4],['G4',.8],['E4',.4],['G4',.4],['A4',.4],['G4',.4],['E4',.4],['D4',.4],['C4',.4],['C4',.8]];
  const ch=[[[261.63,329.63,392],1.6],[[220,293.66,349.23],1.6],[[174.61,261.63,329.63],1.6],[[196,261.63,329.63],1.6],[[261.63,329.63,392],1.6],[[220,293.66,349.23],1.6],[[174.61,261.63,329.63],1.6],[[196,261.63,329.63],1.6]];
  const tot=mel.reduce((s,[,d])=>s+d,0);
  function loop(t){
    if(!ipm)return;
    let ti=t;
    mel.forEach(([n,d])=>{const o=actx.createOscillator(),g=actx.createGain();o.type='triangle';o.frequency.value=nf[n];g.gain.setValueAtTime(0,ti);g.gain.linearRampToValueAtTime(.35,ti+.02);g.gain.exponentialRampToValueAtTime(.001,ti+d*.9);o.connect(g);g.connect(actx.destination);o.start(ti);o.stop(ti+d);ti+=d;});
    let ct=t;
    ch.forEach(([fs,d])=>{fs.forEach(f=>{const o=actx.createOscillator(),g=actx.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,ct);g.gain.linearRampToValueAtTime(.06,ct+.05);g.gain.setValueAtTime(.06,ct+d-.1);g.gain.linearRampToValueAtTime(0,ct+d);o.connect(g);g.connect(actx.destination);o.start(ct);o.stop(ct+d);});ct+=d;});
    mt=setTimeout(()=>loop(t+tot),Math.max(0,(t+tot-actx.currentTime-.5)*1000));
  }
  loop(actx.currentTime);
}
function stopMusic(){ipm=false;if(mt){clearTimeout(mt);mt=null;}if(actx){actx.close().catch(()=>{});actx=null;}}
const all=[...photos,titleImg];let loaded=0;
const bar=document.getElementById('bar'),sub=document.getElementById('load-sub'),ldiv=document.getElementById('loading');
all.forEach(url=>{const i=new Image();i.onload=i.onerror=()=>{loaded++;bar.style.width=(loaded/all.length*100)+'%';sub.textContent=loaded+' / '+all.length;if(loaded>=all.length)ldiv.classList.add('done');};i.src=url;});
</script>
