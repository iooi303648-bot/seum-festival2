<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>세움학교 축제 - 디지털 갤러리</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#000;font-family:'Apple SD Gothic Neo','Noto Sans KR',Arial,sans-serif;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#111}
#loading{position:fixed;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;z-index:999}
#loading.done{display:none}
#load-text{color:#fff;font-size:18px;font-weight:700}
#load-sub{color:rgba(255,255,255,.45);font-size:12px}
#bar-wrap{width:260px;height:5px;background:rgba(255,255,255,.12);border-radius:3px;overflow:hidden}
#bar{height:100%;background:#3b82f6;border-radius:3px;width:0;transition:width .3s}
#canvas{position:relative;width:96vw;max-width:1800px;aspect-ratio:16/9;max-height:92vh;border-radius:40px;box-shadow:0 60px 120px -20px rgba(0,0,0,.9);overflow:hidden;background:#000}
.slide{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .5s;z-index:1}
.slide.active{opacity:1;pointer-events:auto;z-index:2}
.s-hdr{position:absolute;top:24px;left:36px;right:36px;display:flex;align-items:center;justify-content:space-between;z-index:10;pointer-events:none}
.s-brand{display:flex;align-items:center;gap:12px;padding:7px 18px 7px 7px;border-radius:999px;backdrop-filter:blur(12px)}
.s-brand.lt{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2)}
.s-brand.dk{background:rgba(0,0,0,.05);border:1px solid rgba(0,0,0,.08)}
.s-eyo{width:34px;height:34px;border-radius:50%;object-fit:contain;background:#fff}
.s-nm{font-size:14px;font-weight:900;letter-spacing:0}
.s-nm.lt{color:#fff}.s-nm.dk{color:#111}
.s-sb{font-size:9px;font-weight:700;letter-spacing:.2em;text-transform:uppercase}
.s-sb.lt{color:rgba(255,255,255,.45)}.s-sb.dk{color:rgba(0,0,0,.35)}
.s-cnt{font-family:Consolas,monospace;font-size:12px;font-weight:900;padding:5px 14px;border-radius:10px}
.s-cnt.lt{color:rgba(255,255,255,.35);border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05)}
.s-cnt.dk{color:rgba(0,0,0,.3);border:1px solid rgba(0,0,0,.08);background:rgba(0,0,0,.03)}
.g-wrap{display:flex;flex-direction:column;height:100%;background:#fff}
.g-top{padding:16px 32px 10px;border-bottom:1px solid #f0f0f0;display:flex;flex-direction:column;align-items:center;gap:3px;flex-shrink:0}
.g-title{display:flex;align-items:center;gap:10px;font-size:clamp(16px,2.4vw,30px);font-weight:900;letter-spacing:0;color:#1a1a1a;line-height:1.15;white-space:nowrap}
.g-slogo{height:2.4rem;width:auto;max-width:210px;object-fit:contain}
.g-sub{font-size:clamp(9px,1vw,12px);font-weight:700;color:#999;font-style:italic;line-height:1.4;text-align:center}
.photo-board{display:flex;flex-direction:column;gap:14px;padding:14px 28px 18px;flex:1;min-height:0;background:#fff;overflow:hidden}
.photo-row{display:flex;align-items:center;justify-content:center;gap:18px;min-height:0;flex:1}
.photo-row.single{flex:1.18}
.photo-row img{height:100%;width:auto;max-width:100%;object-fit:contain;display:block;border-radius:14px;background:#111;box-shadow:0 0 0 1px #eee}
.photo-row.missing{color:#777;font-size:13px;font-weight:700;text-align:center}
.dk-slide{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:72px 48px}
.intro-slide{background:#000}
.intro-img{max-height:58%;width:auto;max-width:80%;object-fit:contain;background:#000;border-radius:20px}
#ctrl{position:fixed;bottom:18px;display:flex;align-items:center;gap:18px;background:rgba(255,255,255,.95);backdrop-filter:blur(20px);padding:9px 26px;border-radius:999px;border:1px solid rgba(255,255,255,.5);box-shadow:0 16px 40px rgba(0,0,0,.25);z-index:200}
#ctrl.hidden{display:none}
.c-btn{width:34px;height:34px;border-radius:50%;background:transparent;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#555}
.c-btn:hover{background:rgba(0,0,0,.06)}
#pbtn{width:38px;height:38px;border-radius:50%;background:#111;color:#fff;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.2)}
#pbtn.on{background:#3b82f6}
.c-div{width:1px;height:18px;background:rgba(0,0,0,.1)}
#rbtn{background:#111;color:#fff;border:none;cursor:pointer;padding:7px 16px;border-radius:999px;font-size:10px;font-weight:700;letter-spacing:.1em;display:flex;align-items:center;gap:5px;font-family:inherit;white-space:nowrap}
#esc{position:fixed;bottom:22px;color:rgba(255,255,255,.25);font-size:10px;font-weight:700;letter-spacing:.35em;text-transform:uppercase;display:none}
@media (max-width:700px){#canvas{width:100vw;height:100vh;max-height:none;border-radius:0;aspect-ratio:auto}.s-hdr{top:14px;left:14px;right:14px}.photo-board{gap:8px;padding:10px}.photo-row{gap:8px;flex-wrap:wrap;align-content:center}.photo-row img{height:auto;max-height:100%;max-width:48%}.photo-row.single img{max-width:96%}.g-top{padding:58px 12px 8px}.g-title{font-size:18px}.g-slogo{max-width:140px}.dk-slide{padding:76px 24px}}
</style>
</head>
<body>
<div id="loading">
  <div id="load-text">이미지 불러오는 중...</div>
  <div id="bar-wrap"><div id="bar"></div></div>
  <div id="load-sub">0 / 0</div>
  <div style="color:rgba(255,255,255,.15);font-size:10px;font-weight:700;letter-spacing:.3em;text-transform:uppercase;margin-top:4px">Seum School Festival</div>
</div>
<div id="canvas"></div>
<div id="ctrl">
  <button class="c-btn" type="button" onclick="go(cur-1)" aria-label="이전"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>
  <button id="pbtn" type="button" onclick="togglePlay()" aria-label="재생">
    <svg id="iplay" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
    <svg id="ipause" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="display:none"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
  </button>
  <button class="c-btn" type="button" onclick="go(cur+1)" aria-label="다음"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></button>
  <div class="c-div"></div>
  <button id="rbtn" type="button" onclick="recMode()"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg> RECORDING MODE</button>
</div>
<div id="esc">PRESS ESC TO RESTORE MENU</div>
<script>
const RAW='https://raw.githubusercontent.com/iooi303648-bot/seum-festival2/main/';
const VERSION='373c64c';
const asset=name=>RAW+name.split('/').map(encodeURIComponent).join('/')+'?v='+VERSION;
const SLOGO=asset('교포.png');
const RLOGO=asset('세움학교 로고.png');
const titleImg=asset('KakaoTalk_20260504_111859834.png');
const basePhotos=Array.from({length:106},(_,i)=>{const n=i+1,ext=(n>=46&&n<=54)?'.JPG':'.jpg';return {url:asset(`사진 (${n})${ext}`),num:n};});
const extraPhotos=Array.from({length:35},(_,i)=>{const n=i+110;return {url:asset(`${n}.jpg`),num:n};});
const photoUrls=[...basePhotos,...extraPhotos];
let cur=0,TOTAL=0,playing=false,timer=null,actx=null,ipm=false,mt=null,sls=[];
const canvas=document.getElementById('canvas');
const bar=document.getElementById('bar'),sub=document.getElementById('load-sub'),ldiv=document.getElementById('loading');
let loaded=0,loadTotal=photoUrls.length+3;

function tick(){loaded++;bar.style.width=(loaded/loadTotal*100)+'%';sub.textContent=loaded+' / '+loadTotal;}
function probe(url,num){
  return new Promise(resolve=>{
    const img=new Image();
    img.onload=()=>{tick();resolve({url,num,width:img.naturalWidth,height:img.naturalHeight,aspect:img.naturalWidth/img.naturalHeight,ok:true});};
    img.onerror=()=>{tick();resolve({url,num,width:1,height:1,aspect:1,ok:false});};
    img.src=url;
  });
}
function chunk(items,size){const out=[];for(let i=0;i<items.length;i+=size)out.push(items.slice(i,i+size));return out;}
function balanceRows(items,rowCount){
  const rows=Array.from({length:rowCount},()=>({items:[],aspect:0}));
  items.forEach(item=>{
    rows.sort((a,b)=>a.aspect-b.aspect);
    rows[0].items.push(item);
    rows[0].aspect+=item.aspect;
  });
  return rows.map(r=>r.items.sort((a,b)=>a.num-b.num)).filter(Boolean).filter(r=>r.length);
}
function hdr(light,idx){
  const d=document.createElement('div');d.className='s-hdr';
  const t=light?'lt':'dk';
  const brand=document.createElement('div');brand.className='s-brand '+t;
  const ey=document.createElement('img');ey.src=SLOGO;ey.className='s-eyo';ey.alt='학교 상징';
  const tx=document.createElement('div');
  const nm=document.createElement('div');nm.className='s-nm '+t;nm.textContent='동일중앙초등학교';
  const sb=document.createElement('div');sb.className='s-sb '+t;sb.textContent='Seum School Festival';
  tx.append(nm,sb);brand.append(ey,tx);
  const cnt=document.createElement('div');cnt.className='s-cnt '+t;
  cnt.textContent=String(idx+1).padStart(2,'0')+' / '+String(TOTAL).padStart(2,'0');
  d.append(brand,cnt);
  return d;
}
function createIntro(){
  const d=document.createElement('div');d.className='slide active dk-slide intro-slide';
  const img=document.createElement('img');img.src=titleImg;img.alt='인트로';img.className='intro-img';
  const p=document.createElement('p');
  p.style.cssText='margin-top:24px;font-size:clamp(14px,2vw,26px);font-weight:300;color:rgba(255,255,255,.9);text-align:center;line-height:1.7;white-space:pre-line';
  p.textContent='우리가 직접 만들고 배우는\n반짝반짝 즐거운 축제 이야기 ✨';
  d.append(img,p,hdr(true,0));canvas.appendChild(d);
}
function createGallery(groups){
  let slideIndex=1;
  groups.forEach(group=>{
    group.chunks.forEach(items=>{
      const d=document.createElement('div');d.className='slide';
      const w=document.createElement('div');w.className='g-wrap';
      const top=document.createElement('div');top.className='g-top';
      const title=document.createElement('div');title.className='g-title';
      const bell=document.createElement('span');bell.textContent=group.kind==='portrait'?'▥':'▤';
      const rlogo=document.createElement('img');rlogo.src=RLOGO;rlogo.className='g-slogo';rlogo.alt='세움학교 로고';
      const act=document.createElement('span');act.textContent=group.label;
      title.append(bell,rlogo,act);
      const sub=document.createElement('div');sub.className='g-sub';sub.textContent='친구들과 함께한 즐거운 순간들 ✨';
      top.append(title,sub);
      const board=document.createElement('div');board.className='photo-board';
      const rowCount=group.kind==='portrait'
        ? (items.length<=4?1:2)
        : (items.length<=3?1:2);
      balanceRows(items,rowCount).forEach(rowItems=>{
        const row=document.createElement('div');row.className='photo-row '+(rowItems.length===1?'single':'');
        rowItems.forEach(item=>{
          const img=document.createElement('img');img.src=item.url;img.alt='세움학교 활동 '+item.num;
          img.style.aspectRatio=`${item.width} / ${item.height}`;
          img.onerror=()=>{row.classList.add('missing');row.textContent='이미지를 불러오지 못했습니다';};
          row.appendChild(img);
        });
        board.appendChild(row);
      });
      w.append(top,board);d.append(w,hdr(false,slideIndex));canvas.appendChild(d);slideIndex++;
    });
  });
}
function createOutro(){
  const idx=TOTAL-1;
  const d=document.createElement('div');d.className='slide dk-slide';d.style.background='#000';
  const logoWrap=document.createElement('div');
  logoWrap.style.cssText='width:72px;height:72px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 24px;overflow:hidden;box-shadow:0 8px 32px rgba(255,255,255,.15)';
  const elo=document.createElement('img');elo.src=SLOGO;elo.alt='학교 상징';elo.style.cssText='width:80%;height:80%;object-fit:contain';
  logoWrap.appendChild(elo);
  const h1=document.createElement('div');
  h1.style.cssText='font-size:clamp(36px,6vw,80px);font-weight:900;letter-spacing:0;color:#fff;text-align:center;line-height:1.05;white-space:pre-line';
  h1.textContent='더 넓은 세상으로\n함께 나아가요!';
  const h2=document.createElement('div');
  h2.style.cssText='margin-top:20px;font-size:clamp(13px,1.6vw,22px);font-weight:300;color:rgba(255,255,255,.8);text-align:center;line-height:1.7;white-space:pre-line';
  h2.textContent='언제나 스스로 생각하고 실천하는\n멋진 세움학교 어린이가 될게요! ✨';
  d.append(logoWrap,h1,h2,hdr(true,idx));canvas.appendChild(d);
}
async function build(){
  await Promise.all([probe(SLOGO,0),probe(RLOGO,0),probe(titleImg,0)]);
  const measured=await Promise.all(photoUrls.map(p=>probe(p.url,p.num)));
  const landscape=measured.filter(p=>p.ok&&p.width>=p.height).sort((a,b)=>a.num-b.num);
  const portrait=measured.filter(p=>p.ok&&p.width<p.height).sort((a,b)=>a.num-b.num);
  const missing=measured.filter(p=>!p.ok).sort((a,b)=>a.num-b.num);
  const groups=[
    {kind:'landscape',label:'축제 이야기',chunks:chunk(landscape.concat(missing),5)},
    {kind:'portrait',label:'축제 이야기',chunks:chunk(portrait,8)}
  ].filter(g=>g.chunks.length);
  TOTAL=2+groups.reduce((sum,g)=>sum+g.chunks.length,0);
  createIntro();createGallery(groups);createOutro();
  sls=[...canvas.querySelectorAll('.slide')];
  ldiv.classList.add('done');
}
function go(n){if(n<0||n>=TOTAL||!sls.length)return;sls[cur].classList.remove('active');cur=n;sls[cur].classList.add('active');}
function togglePlay(){
  playing=!playing;
  document.getElementById('iplay').style.display=playing?'none':'block';
  document.getElementById('ipause').style.display=playing?'block':'none';
  document.getElementById('pbtn').classList.toggle('on',playing);
  if(playing){playMusic();timer=setInterval(()=>go((cur+1)%TOTAL),3500);}else{stopMusic();clearInterval(timer);}
}
function recMode(){if(!playing)togglePlay();document.getElementById('ctrl').classList.add('hidden');document.getElementById('esc').style.display='block';}
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight')go(cur+1);
  if(e.key==='ArrowLeft')go(cur-1);
  if(e.key===' '&&document.activeElement.tagName!=='BUTTON'){e.preventDefault();togglePlay();}
  if(e.key==='Escape'){document.getElementById('ctrl').classList.remove('hidden');document.getElementById('esc').style.display='none';}
});
function playMusic(){
  if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();
  if(actx.state==='suspended')actx.resume();
  ipm=true;
  const nf={C4:261.63,D4:293.66,E4:329.63,F4:349.23,G4:392,A4:440,B4:493.88,C5:523.25};
  const mel=[['E4',.4],['G4',.4],['A4',.4],['G4',.4],['E4',.4],['C4',.4],['D4',.4],['E4',.8],['E4',.4],['G4',.4],['A4',.4],['G4',.4],['E4',.4],['C4',.4],['D4',.4],['C4',.8],['G4',.4],['A4',.4],['C5',.4],['A4',.4],['G4',.4],['E4',.4],['F4',.4],['G4',.8],['E4',.4],['G4',.4],['A4',.4],['G4',.4],['E4',.4],['D4',.4],['C4',.4],['C4',.8]];
  const ch=[[[261.63,329.63,392],1.6],[[220,293.66,349.23],1.6],[[174.61,261.63,329.63],1.6],[[196,261.63,329.63],1.6],[[261.63,329.63,392],1.6],[[220,293.66,349.23],1.6],[[174.61,261.63,329.63],1.6],[[196,261.63,329.63],1.6]];
  const tot=mel.reduce((s,[,d])=>s+d,0);
  function loop(t){
    if(!ipm)return;
    let ti=t;
    mel.forEach(([n,d])=>{const o=actx.createOscillator(),g=actx.createGain();o.type='triangle';o.frequency.value=nf[n];g.gain.setValueAtTime(0,ti);g.gain.linearRampToValueAtTime(.35,ti+.02);g.gain.exponentialRampToValueAtTime(.001,ti+d*.9);o.connect(g);g.connect(actx.destination);o.start(ti);o.stop(ti+d);ti+=d;});
    let ct=t;
    ch.forEach(([fs,d])=>{fs.forEach(f=>{const o=actx.createOscillator(),g=actx.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,ct);g.gain.linearRampToValueAtTime(.06,ct+.05);g.gain.setValueAtTime(.06,ct+d-.1);g.gain.linearRampToValueAtTime(0,ct+d);o.connect(g);g.connect(actx.destination);o.start(ct);o.stop(ct+d);});ct+=d;});
    mt=setTimeout(()=>loop(t+tot),Math.max(0,(t+tot-actx.currentTime-.5)*1000));
  }
  loop(actx.currentTime);
}
function stopMusic(){ipm=false;if(mt){clearTimeout(mt);mt=null;}if(actx){actx.close().catch(()=>{});actx=null;}}
build();
</script>
</body>
</html>
